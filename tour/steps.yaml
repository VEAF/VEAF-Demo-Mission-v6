# Visite guidée de la mission de démo — SOURCE UNIQUE.
#
# Ce fichier produit, par `python tools/gen_tour.py` :
#   - src/scripts/guided-tour.lua : les menus F10 « Visite guidée » / « Guided tour » ;
#   - README.md et README.en.md : le guide détaillé, une section par étape ;
#   - docs/recette.md : la liste de contrôle avant release.
# Ne modifiez pas ces fichiers à la main : modifiez celui-ci, puis relancez le générateur.
#
# Une nouvelle fonctionnalité VEAF = une étape (ou une ligne dans une étape existante), avec son
# contrôle de recette (`check`). C'est la règle du dépôt (voir CLAUDE.md).
#
# Champs d'une étape :
#   id        identifiant stable (sert au nom des repères F10)
#   chapter   chapitre (clé de `chapters`)
#   title     fr / en
#   anchor    où aller : zone: <trigger zone> | group: <groupe ou statique> | airbase: <aérodrome>
#             (absent = étape sans lieu) ; le générateur en tire le bullseye et la base la plus proche
#   modules   modules VEAF démontrés (noms de mission.yaml) ; `build:` pour ce que fait le build
#   what      fr / en : ce que c'est, en une ou deux phrases
#   how       fr / en : ce que le joueur fait (liste)
#   see       fr / en : ce qu'il doit observer
#   check     contrôle de recette (fr) : l'observable qui dit que la fonctionnalité marche, à l'œil
#   probe     sondes lancées par tools/recette_pont.py dans la mission en cours (dcs-bridge) :
#             liste de { name, act?, check, wait?, timeout? }, Lua avec les fonctions R.* de
#             tools/recette-lib.lua ; `check` rend `ok, détail` (voir le skill maj-demo)
#   doc       page de documentation VEAF (chemin après /documentation/latest/)
#   links     facultatif : autres pages de la documentation, liste de { path, fr, en } (libellé du lien)

chapters:
  start: { fr: "1. Prise en main", en: "1. Getting started" }
  ground: { fr: "2. Zones de combat", en: "2. Combat zones" }
  air: { fr: "3. Menace aérienne", en: "3. Air threats" }
  support: { fr: "4. Soutien et logistique", en: "4. Support and logistics" }

steps:
  # ── 1. Prise en main ───────────────────────────────────────────────────────────────────────
  - id: welcome
    chapter: start
    title: { fr: "Bienvenue", en: "Welcome" }
    modules: [RADIO, build:dynamic_slots, build:presets, build:waypoints, build:weather]
    what:
      fr: "Cette mission montre chaque fonctionnalité des outils VEAF, une par étape. Chaque étape donne le lieu, ce qu'il faut faire et ce qu'on doit voir. Un repère est posé sur votre carte F10 quand vous ouvrez une étape."
      en: "This mission shows every feature of the VEAF tools, one per step. Each step gives the place, what to do and what you should see. A mark is placed on your F10 map when you open a step."
    how:
      fr:
        - "Les menus VEAF sont dans F10 > Autre > VEAF ; ce menu a plusieurs pages (« Page suivante » en bas). La visite guidée et le menu « Démo : commandes » sont à part, directement dans F10 > Autre."
        - "Beaucoup de commandes se tapent dans un marqueur de la carte F10 : bouton « Ajouter un repère » de la barre du haut, clic sur la carte, tapez le texte, puis cliquez ailleurs pour valider."
        - "Slots : à Kutaisi, des slots classiques moteur chaud (A-10C II, F-16C, F/A-18C, UH-1H, Mi-8, AH-64D), et des slots dynamiques sur les quatre bases bleues en multijoueur ; sur les porte-avions, F/A-18C et F-14B."
      en:
        - "VEAF menus are under F10 > Other > VEAF; that menu has several pages (\"Next page\" at the bottom). The guided tour and the \"Demo: commands\" menu are separate, directly under F10 > Other."
        - "Many commands are typed into an F10 map marker: \"Add mark\" button in the top bar, click on the map, type the text, then click elsewhere to validate."
        - "Slots: classic hot-start slots at Kutaisi (A-10C II, F-16C, F/A-18C, UH-1H, Mi-8, AH-64D), dynamic slots on the four blue bases in multiplayer; F/A-18C and F-14B on the carriers."
    see:
      fr: "Le menu VEAF, ses sous-menus, et dans chaque avion les préréglages radio et les points de navigation injectés par le build."
      en: "The VEAF menu and its submenus, and in every aircraft the radio presets and waypoints injected by the build."
    check: "Menu F10 > Autre > VEAF présent ; canal 1 de la radio d'un F-16C = un canal du plan VEAF ; points de navigation présents dans l'avion ; slots dynamiques sur Kutaisi, Senaki, Kobuleti, Batumi (multijoueur)."
    probe:
    - name: "Configuration VEAF chargée en entier (zones, missions, QRA, moyens, fonction du menu Démo)"
      check: |
        local zones, missions = R.count(veafCombatZone.zonesDict), R.count(veafCombatMission.missionsDict)
        local ok = zones >= 12 and missions >= 30 and veafQraManager.get("QRA Sukhumi") ~= nil
          and veafAssets.get("Texaco 1") ~= nil and type(demo.spawnCsar) == "function"
        return ok, zones .. " zones, " .. missions .. " missions"
    - name: "Mission, configuration VEAF et visite guidée dans la langue demandée (--lang)"
      check: |
        local cfg = veaf.config.language or "fr"
        local tour = demoTour and demoTour.lang
        return cfg == R.expected and tour == R.expected, "config " .. tostring(cfg) .. ", visite " .. tostring(tour) .. ", attendu " .. R.expected
    - name: "Menu VEAF > MISSIONS présent dès le démarrage"
      check: |
        for _, sm in ipairs(veafRadio._builder._root.subMenus) do
          if sm.title == "MISSIONS" then return true, #sm.subMenus .. " missions au menu" end
        end
        return false, "pas de menu MISSIONS (VMCT FIX-COMBATMISSION-MENU-MISSING)"
    doc: "mission-maker/GUIDE/"

  - id: sandbox
    chapter: start
    title: { fr: "Bac à sable : les commandes de marqueur", en: "Sandbox: marker commands" }
    anchor: { zone: "Bac a sable" }
    modules: [SPAWN, SHORTCUTS, NAMEDPOINTS, GRASS]
    what:
      fr: "Le bac à sable, au sud de Kutaisi (point nommé ALPHA), sert à essayer les commandes qu'on tape dans un marqueur F10 : faire apparaître des unités, un convoi, de la fumée, un FARP, et tout effacer."
      en: "The sandbox, south of Kutaisi (named point ALPHA), is where you try the commands typed into an F10 marker: spawn units, a convoy, smoke, a FARP, and wipe it all."
    how:
      fr:
        - "`-sa8` : une batterie SA-8 (alias livré ; tous les alias sont listés dans la page « Alias » de la documentation)."
        - "`-armor` : un groupe blindé tiré au sort ; `-armor, size 4, defense 0` pour le régler."
        - "`_spawn unit, name T-80UD, hdg 270` : un char isolé, cap 270."
        - "`-convoy, dest ALPHA` : un convoi qui rejoint le point nommé ALPHA par la route (posez le marqueur à quelques km)."
        - "`-point BRAVO` : crée votre propre point nommé (alias de `_name point BRAVO`), réutilisable dans `-convoy, dest BRAVO`."
        - "`-smoke` : une fumée blanche (`-smoke, color red` pour du rouge) ; `-farp` : un FARP complet avec son décor."
        - "`-boum` : une explosion de 500 kg ; `-menage` : détruit tout dans un rayon de 2 km (deux raccourcis propres à cette mission)."
      en:
        - "`-sa8`: an SA-8 battery (shipped alias; every alias is listed on the 'Aliases' page of the documentation)."
        - "`-armor`: a random armour group; `-armor, size 4, defense 0` to tune it."
        - "`_spawn unit, name T-80UD, hdg 270`: a single tank, heading 270."
        - "`-convoy, dest ALPHA`: a convoy that drives by road to the named point ALPHA (place the marker a few km away)."
        - "`-point BRAVO`: creates your own named point (alias of `_name point BRAVO`), usable in `-convoy, dest BRAVO`."
        - "`-smoke`: white smoke (`-smoke, color red` for red); `-farp`: a complete FARP with its props."
        - "`-boum`: a 500 kg explosion; `-menage`: destroys everything within 2 km (two shortcuts defined by this mission)."
    see:
      fr: "Chaque commande répond par un message et fait apparaître ce qu'elle annonce à l'emplacement du marqueur ; le marqueur disparaît une fois la commande exécutée."
      en: "Each command answers with a message and spawns what it announces at the marker; the marker disappears once the command has run."
    check: "`-sa8`, `-armor`, `-convoy, dest ALPHA`, `-point`, `-smoke`, `-farp`, `-boum`, `-menage` : chacune produit son effet au marqueur, sans erreur dans dcs.log."
    probe:
    - name: "`-sa8` : une batterie SA-8 au marqueur"
      act: |
        R.marker("-sa8", "Bac a sable", -1500, 0)
      check: |
        local _, _, t = R.inZone("Bac a sable")
        return (t["Osa 9A33 ln"] or 0) >= 1, R.types(t)
      timeout: 20
    - name: "`_spawn unit, name T-80UD, hdg 270` : un char"
      act: |
        R.marker("_spawn unit, name T-80UD, hdg 270", "Bac a sable", 1500, 0)
      check: |
        local _, _, t = R.inZone("Bac a sable")
        return (t["T-80UD"] or 0) >= 1, R.types(t)
      timeout: 20
    - name: "`-armor` : un groupe blindé"
      act: |
        R.mem.armorBefore = R.inZone("Bac a sable")
        R.marker("-armor", "Bac a sable", 0, 1500)
      check: |
        local n = R.inZone("Bac a sable")
        return n >= R.mem.armorBefore + 3, R.mem.armorBefore .. " -> " .. n .. " unités"
      timeout: 20
    - name: "`-point BRAVO` : un point nommé"
      act: |
        R.marker("-point BRAVO", "Bac a sable", 0, -1500)
      check: |
        return veafNamedPoints.getPoint("BRAVO") ~= nil, ""
      timeout: 10
    - name: "`-farp` : un FARP et son décor"
      act: |
        local _, s = R.inZone("Bac a sable")
        R.mem.farpBefore = s
        R.marker("-farp", "Bac a sable", 1000, 1000)
      check: |
        local _, s = R.inZone("Bac a sable")
        return s > R.mem.farpBefore, R.mem.farpBefore .. " -> " .. s .. " statiques"
      timeout: 20
    - name: "`-menage` : tout est détruit autour du marqueur"
      act: |
        R.marker("-menage", "Bac a sable")
      check: |
        local n, _, t = R.inZone("Bac a sable", -1500)
        return n == 0, n .. " unités restantes " .. R.types(t)
      timeout: 30
    doc: "mission-maker/scripts/veafSpawn/"
    links:
      - { path: "ALIASES/", fr: "Liste des alias", en: "Alias list" }

  - id: generated
    chapter: start
    title: { fr: "Missions générées : CAS et transport", en: "Generated missions: CAS and transport" }
    anchor: { zone: "Bac a sable" }
    modules: [CASMISSION, TRANSPORTMISSION, GROUNDAI]
    what:
      fr: "Deux commandes fabriquent une mission complète là où vous posez le marqueur : un appui aérien rapproché (CAS) ou un transport héliporté."
      en: "Two commands build a complete mission where you place the marker: a close air support (CAS) task or a helicopter transport task."
    how:
      fr:
        - "`_cas` (ou `_cas, size 3, defense 2`) dans un marqueur du bac à sable : un groupe ennemi apparaît dans la zone, à trouver et détruire."
        - "Menu F10 > Autre > VEAF > MISSION CAS : informations sur la cible, fumée, éclairage, passer l'objectif."
        - "`_transport, from ALPHA` dans un marqueur posé près du FARP Khoni (à plus de 15 km d'ALPHA) : des caisses à prendre à ALPHA et à livrer au marqueur."
        - "Menu F10 > Autre > VEAF > MISSION DE TRANSPORT : position de la zone de livraison, fumée."
      en:
        - "`_cas` (or `_cas, size 3, defense 2`) in a sandbox marker: an enemy group appears in the area, to find and destroy."
        - "F10 > Other > VEAF > CAS MISSION: target information, smoke, illumination, skip the target."
        - "`_transport, from ALPHA` in a marker near FARP Khoni (more than 15 km from ALPHA): cargo to pick up at ALPHA and deliver at the marker."
        - "F10 > Other > VEAF > TRANSPORT MISSION: drop zone position, smoke."
    see:
      fr: "Un menu propre à la mission générée, et un message quand l'objectif est atteint."
      en: "A menu specific to the generated mission, and a message when the objective is met."
    check: "`_cas` : groupe ennemi créé, menu MISSION CAS peuplé, fumée sur cible. `_transport, from ALPHA` : menu MISSION DE TRANSPORT peuplé, zone de livraison fumée."
    probe:
    - name: "`_cas` : un groupe ennemi et le menu MISSION CAS"
      act: |
        R.marker("_cas", "Bac a sable")
      check: |
        local menu = R.menu(R.L("MISSION CAS", "CAS MISSION"))
        local g = Group.getByName(veafCasMission.casGroupName)
        local n = R.alive(veafCasMission.casGroupName)
        local enemy = g ~= nil and g:getCoalition() == coalition.side.RED
        return n > 0 and enemy and #menu.commands + #menu.subMenus > 1, n .. " unités ennemies dans " .. veafCasMission.casGroupName
      timeout: 30
    - name: "`_transport, from ALPHA` : mission créée, menu MISSION DE TRANSPORT peuplé"
      act: |
        R.marker("_transport, from ALPHA", "combatZone_Khoni_Easy", 4000, 0)
      check: |
        local menu = R.menu(R.L("MISSION DE TRANSPORT", "TRANSPORT MISSION"))
        local titles = {}
        for _, c in ipairs(menu.commands) do table.insert(titles, c.title) end
        return #menu.commands > 1, table.concat(titles, " | ")
      timeout: 30
    doc: "mission-maker/scripts/veafCasMission/"

  # ── 2. Zones de combat ─────────────────────────────────────────────────────────────────────
  - id: training
    chapter: ground
    title: { fr: "Entraînement de Khoni : trois niveaux", en: "Khoni training range: three levels" }
    anchor: { zone: "combatZone_Khoni_Easy" }
    modules: [COMBATZONE, AIEN]
    what:
      fr: "Une zone d'entraînement en trois niveaux posés sur le même cercle. Chaque niveau inclut le précédent : le moyen fait apparaître les cibles du facile en plus des siennes, le difficile celles du moyen."
      en: "A training range in three levels on the same circle. Each level includes the one below: medium also spawns the easy targets, hard also spawns the medium ones."
    how:
      fr:
        - "Menu F10 > Autre > VEAF > ZONES DE COMBAT > Entraînement Khoni > Khoni - facile > Activer la zone."
        - "Détruisez les camions, puis désactivez et passez au niveau moyen, puis au difficile."
        - "Infos de la zone, fumée et fusée éclairante dans le même menu."
      en:
        - "F10 > Other > VEAF > COMBAT ZONES > Khoni training > Khoni - easy > Activate zone."
        - "Destroy the trucks, then deactivate and move on to medium, then hard."
        - "Zone info, smoke and illumination flare are in the same menu."
    see:
      fr: "Facile : huit camions. Moyen : les camions, une compagnie blindée et deux pièces de DCA tirées parmi quatre (jamais les mêmes d'une fois sur l'autre). Difficile : en plus, un bataillon blindé et deux systèmes courte portée tirés au sort."
      en: "Easy: eight trucks. Medium: the trucks, an armour company and two AAA pieces drawn among four (never the same twice). Hard: on top, an armour battalion and two short-range systems drawn at random."
    check: "Chaque niveau fait apparaître plus que celui qu'il inclut ; le tirage #spawngroup donne 2 pièces de DCA sur 4 au moyen, différentes d'une activation à l'autre ; la zone se termine quand tout est détruit."
    probe:
    - name: "Khoni facile : huit camions"
      act: |
        R.click(R.L("ZONES DE COMBAT", "COMBAT ZONES"), R.L("Entraînement Khoni", "Khoni training"), R.L("Khoni - facile", "Khoni - easy"), R.L("Activer la zone", "Activate zone"))
      check: |
        local n, _, t = R.inZone("combatZone_Khoni_Easy")
        R.mem.easy = n
        return n >= 8, n .. " unités " .. R.types(t)
      timeout: 30
    - name: "Khoni moyen : plus que le facile, dont 2 pièces de DCA sur 4"
      act: |
        veafCombatZone.DesactivateZone("combatZone_Khoni_Easy", true)
        R.click(R.L("ZONES DE COMBAT", "COMBAT ZONES"), R.L("Entraînement Khoni", "Khoni training"), R.L("Khoni - moyen", "Khoni - medium"), R.L("Activer la zone", "Activate zone"))
      check: |
        local n, _, t = R.inZone("combatZone_Khoni_Easy")
        R.mem.medium = n
        -- les pièces de DCA tirées au sort (#spawngroup) sont des groupes à part ; un Shilka peut aussi
        -- venir de la défense du peloton blindé, d'où le compte par groupe et non par type d'unité
        local aaa = 0
        for _, name in pairs(veafCombatZone.GetZone("combatZone_Khoni_Medium").spawnedGroups or {}) do
          if not name:find("-target-", 1, true) and not name:find("Armored", 1, true) then aaa = aaa + 1 end
        end
        return n > R.mem.easy and aaa == 2, R.mem.easy .. " -> " .. n .. " unités, " .. aaa .. " groupes de DCA, " .. R.types(t)
      wait: 5
      timeout: 30
    - name: "Khoni difficile : plus que le moyen"
      act: |
        veafCombatZone.DesactivateZone("combatZone_Khoni_Medium", true)
        R.click(R.L("ZONES DE COMBAT", "COMBAT ZONES"), R.L("Entraînement Khoni", "Khoni training"), R.L("Khoni - difficile", "Khoni - hard"), R.L("Activer la zone", "Activate zone"))
      check: |
        local n, _, t = R.inZone("combatZone_Khoni_Easy")
        return n > R.mem.medium, R.mem.medium .. " -> " .. n .. " unités " .. R.types(t)
      wait: 5
      timeout: 30
    doc: "mission-maker/scripts/veafCombatZone/"

  - id: front
    chapter: ground
    title: { fr: "Front de Gali, et le drone JTAC", en: "Gali front, and the JTAC drone" }
    anchor: { zone: "combatZone_Gali" }
    modules: [COMBATZONE, ASSETS, CTLD]
    what:
      fr: "Une vraie zone de combat sur le front de l'Inguri. Son contenu est décrit par des unités-porteuses qui portent une commande (#command) : la zone fait apparaître à leur place un groupe blindé tiré au sort parmi deux, une batterie d'artillerie, une DCA et des MANPADS. Le drone Reaper 1 orbite au-dessus et désigne les blindés au laser."
      en: "A real combat zone on the Inguri front. Its content is described by carrier units holding a command (#command): the zone spawns in their place one armour group drawn among two, an artillery battery, air defence and MANPADS. The Reaper 1 drone orbits above and lases the armour."
    how:
      fr:
        - "Menu F10 > Autre > VEAF > ZONES DE COMBAT > Front de Gali > +Activer la zone."
        - "Le JTAC : code laser 1511, radio 35.55 FM ; menu F10 > Autre > CTLD > JTAC pour la cible en cours."
        - "Le drone est relançable depuis F10 > Autre > VEAF > MOYENS > Reaper 1 (MQ-9, JTAC)."
      en:
        - "F10 > Other > VEAF > COMBAT ZONES > Gali front > +Activate zone."
        - "The JTAC: laser code 1511, radio 35.55 FM; F10 > Other > CTLD > JTAC for the current target."
        - "The drone can be respawned from F10 > Other > VEAF > ASSETS > Reaper 1 (MQ-9, JTAC)."
    see:
      fr: "Un seul des deux groupes blindés apparaît ; le drone annonce sa cible et la désigne au code 1511."
      en: "Only one of the two armour groups appears; the drone announces its target and lases it on code 1511."
    check: "Un seul groupe blindé sur deux ; artillerie Msta présente ; Reaper 1 déclaré JTAC par CTLD sur le code 1511 et 35.55 FM, et il désigne un véhicule."
    probe:
    - name: "Gali : la zone apparaît, artillerie Msta comprise"
      act: |
        R.click(R.L("ZONES DE COMBAT", "COMBAT ZONES"), R.L("Front de Gali", "Gali front"), R.L("Activer la zone", "Activate zone"))
      check: |
        local n, _, t = R.inZone("combatZone_Gali")
        return n > 0 and (t["SAU Msta"] or 0) > 0, n .. " unités " .. R.types(t)
      timeout: 30
    - name: "Reaper 1 déclaré JTAC par CTLD, code 1511"
      check: |
        local j = CTLDJTACManager.getInstance().jtacs["Reaper 1"]
        return j ~= nil and j.laserCode == 1511, j and ("code " .. tostring(j.laserCode) .. ", " .. tostring(j.state)) or "absent"
    doc: "mission-maker/concepts/combat-zones/"

  - id: iads
    chapter: ground
    title: { fr: "Défense aérienne intégrée (Skynet)", en: "Integrated air defence (Skynet)" }
    anchor: { zone: "combatZone_Ochamchire_SAM" }
    modules: [SKYNET, INTERPRETER, COMBATZONE]
    what:
      fr: "Le réseau de défense aérienne rouge : un radar d'alerte, un SA-11 et un SA-15 permanents près de Gudauta (posés par #veafInterpreter), plus le SA-6 d'Ochamchire, une zone de combat active dès le démarrage qui rejoint le réseau. Les batteries gardent leur radar éteint et ne l'allument que quand le réseau le leur demande. Les unités au sol rouges servent de guetteurs : elles voient les avions et relaient l'alerte."
      en: "The red air defence network: an early-warning radar, a permanent SA-11 and SA-15 near Gudauta (placed by #veafInterpreter), plus the Ochamchire SA-6, a combat zone active from the start that joins the network. Batteries keep their radar off until the network tells them to light up. Red ground units act as spotters: they see aircraft and relay the alert."
    how:
      fr:
        - "Approchez Ochamchire par le sud-est, à basse altitude puis en montant : regardez quand votre RWR s'allume."
        - "L'état de l'IADS rouge (sites, radars allumés) : F10 > Autre > SKYNET IADS COALITION: RED."
        - "La vue des guetteurs est propre à chaque camp : F10 > Autre > VEAF > RÉSEAU DE GUETTEURS > Afficher la vue des guetteurs montre les guetteurs de VOTRE camp. Pour voir le réseau rouge, prenez le slot game master rouge de la mission de test (rouvrez la carte F10 après le clic)."
      en:
        - "Approach Ochamchire from the south-east, low then climbing: watch when your RWR lights up."
        - "Red IADS status (sites, radars on): F10 > Other > SKYNET IADS COALITION: RED."
        - "The spotter view belongs to each side: F10 > Other > VEAF > SPOTTER NETWORK > Show the spotter view shows YOUR side's spotters. To see the red network, take the red game master slot of the test mission (reopen the F10 map after clicking)."
    see:
      fr: "Le SA-6 n'émet pas tant que le réseau ne vous a pas détecté, puis s'allume ; le menu SKYNET IADS COALITION: RED montre quel site émet."
      en: "The SA-6 stays silent until the network has detected you, then lights up; the SKYNET IADS COALITION: RED menu shows which site is emitting."
    check: "SA-11, SA-15 et EWR présents dès le départ (interpréteur) ; SA-6 d'Ochamchire actif au démarrage et inscrit dans le réseau Skynet ; radar éteint tant qu'aucun avion bleu n'est détecté ; menu SKYNET IADS COALITION: RED présent ; vue des guetteurs rouge affichable depuis le slot game master rouge."
    probe:
    - name: "Réseau rouge : SA-11, SA-15, SA-6 d'Ochamchire et EWR inscrits dans Skynet"
      check: |
        local iads = veafSkynet.getIADS("red iads")
        local names = {}
        for _, s in ipairs(iads:getSAMSites()) do table.insert(names, s:getDCSName()) end
        local all = table.concat(names, " ")
        local ok = all:find("SA11", 1, true) and all:find("SA15", 1, true) and all:find("SA6", 1, true)
          and #iads:getEarlyWarningRadars() >= 1 and veafCombatZone.GetZone("combatZone_Ochamchire_SAM"):isActive()
        return ok and true or false, #names .. " sites, " .. #iads:getEarlyWarningRadars() .. " EWR : " .. all
    doc: "mission-maker/scripts/veafSkynetIadsHelper/"

  - id: chained
    chapter: ground
    title: { fr: "Mission chaînée : le port d'Ochamchire", en: "Chained mission: Ochamchire port" }
    anchor: { zone: "combatZone_Ochamchire_Port" }
    modules: [COMBATZONE]
    what:
      fr: "Deux zones enchaînées : la seconde n'existe pas tant que la première n'est pas terminée. D'abord le dépôt du port, puis, une minute après sa destruction, les cargos et leur corvette en rade (lutte antinavire)."
      en: "Two chained zones: the second does not exist until the first is complete. First the port depot, then, one minute after it is destroyed, the cargo ships and their corvette at anchor (anti-ship)."
    how:
      fr:
        - "Menu F10 > Autre > VEAF > ZONES DE COMBAT > Port d'Ochamchire - 1 : dépôt > +Activer la zone."
        - "Détruisez les camions et la ZU-23, puis attendez une minute."
      en:
        - "F10 > Other > VEAF > COMBAT ZONES > Ochamchire port - 1: depot > +Activate zone."
        - "Destroy the trucks and the ZU-23, then wait one minute."
    see:
      fr: "La zone 1 se termine, et les navires apparaissent au large sans qu'aucun menu ne les ait activés. Attention : le cercle de la QRA de Soukhoumi couvre Ochamchire."
      en: "Zone 1 completes, and the ships appear offshore without any menu activating them. Beware: the Sukhumi QRA circle covers Ochamchire."
    check: "La zone 2 (navires) n'existe pas avant la fin de la zone 1 et apparaît 60 s après ; elle n'a pas de menu propre."
    probe:
    - name: "Port activé ; la zone des navires n'existe pas encore"
      act: |
        R.click(R.L("ZONES DE COMBAT", "COMBAT ZONES"), R.L("Port d'Ochamchire - 1 : dépôt", "Ochamchire port - 1: depot"), R.L("Activer la zone", "Activate zone"))
      check: |
        local n = R.inZone("combatZone_Ochamchire_Port")
        local ships = veafCombatZone.GetZone("combatZone_Ochamchire_Ships"):isActive()
        return n > 0 and not ships, n .. " unités au port, navires actifs : " .. tostring(ships)
      timeout: 30
    - name: "Port détruit : les navires apparaissent une minute après"
      act: |
        R.destroyZone("combatZone_Ochamchire_Port")
      check: |
        local n, _, t = R.inZone("combatZone_Ochamchire_Ships")
        local cargo = 0
        for k, v in pairs(t) do if k:find("cargo", 1, true) or k == "ELNYA" then cargo = cargo + v end end
        return cargo >= 3, n .. " navires " .. R.types(t)
      wait: 60
      timeout: 120
    doc: "mission-maker/scripts/veafCombatZone/"

  - id: operation
    chapter: ground
    title: { fr: "Opération Tkvarcheli : tâches et dépendances", en: "Operation Tkvarcheli: tasks and dependencies" }
    anchor: { zone: "Op_Tkvarcheli" }
    modules: [COMBATZONE]
    what:
      fr: "Une opération regroupe plusieurs zones en tâches : le radar et le dépôt d'abord, puis le poste de commandement, qui n'est donné comme objectif qu'une fois les deux premiers détruits. Toutes les unités apparaissent à l'activation : la dépendance ordonne les objectifs, pas l'apparition."
      en: "An operation groups several zones as tasks: the radar and the depot first, then the command post, given as an objective only once the first two are destroyed. All units spawn on activation: the dependency orders the objectives, not the spawning."
    how:
      fr:
        - "Menu F10 > Autre > VEAF > ZONES DE COMBAT > Opération Tkvarcheli > +Activer la zone : les trois tâches apparaissent ensemble."
        - "Le même menu donne la tâche en cours ; détruisez le radar 1L13 et le dépôt (statiques), puis le PC."
      en:
        - "F10 > Other > VEAF > COMBAT ZONES > Operation Tkvarcheli > +Activate zone: the three tasks appear together."
        - "The same menu gives the current task; destroy the 1L13 radar and the depot (statics), then the command post."
    see:
      fr: "Les tâches passent de « en cours » à « terminée » ; quand les trois sont faites, le message « L'opération … est terminée »."
      en: "Tasks move from \"in progress\" to \"done\"; when all three are done, the message \"Operation … is over\"."
    check: "L'opération active ses trois zones ; la tâche PC n'est listée comme objectif qu'après radar + dépôt ; les statiques détruits sont comptés (zone dépôt terminée) ; message de fin d'opération."
    probe:
    - name: "Opération activée depuis son menu : les trois tâches apparaissent"
      act: |
        R.click(R.L("ZONES DE COMBAT", "COMBAT ZONES"), R.L("Opération Tkvarcheli", "Operation Tkvarcheli"), R.L("Activer la zone", "Activate zone"))
      check: |
        local parts, ok = {}, true
        for _, z in ipairs({ "combatZone_Tkvarcheli_Radar", "combatZone_Tkvarcheli_Depot", "combatZone_Tkvarcheli_HQ" }) do
          local n, s = R.inZone(z)
          ok = ok and n + s > 0
          table.insert(parts, z:sub(23) .. " " .. n .. "+" .. s)
        end
        return ok, table.concat(parts, ", ")
      timeout: 30
    doc: "mission-maker/scripts/veafCombatZone/"

  - id: convoy
    chapter: ground
    title: { fr: "Convoi en mouvement", en: "Moving convoy" }
    anchor: { zone: "combatZone_Convoy" }
    modules: [COMBATZONE]
    what:
      fr: "Un convoi logistique, cinq camions et sa Shilka, qui fait la navette entre Ochamchire et Gali : une cible qui bouge."
      en: "A logistics convoy, five trucks and their Shilka, shuttling between Ochamchire and Gali: a moving target."
    how:
      fr:
        - "Menu F10 > Autre > VEAF > ZONES DE COMBAT > Convoi d'Ochamchire > +Activer la zone."
        - "Infos de la zone : la position du convoi au moment de la demande."
      en:
        - "F10 > Other > VEAF > COMBAT ZONES > Ochamchire convoy > +Activate zone."
        - "Zone info: the convoy position when you ask."
    see:
      fr: "Le convoi roule vers Gali, puis revient, en boucle."
      en: "The convoy drives to Gali, then comes back, in a loop."
    check: "Le convoi roule (position qui change entre deux relevés), atteint Gali et repart vers Ochamchire."
    probe:
    - name: "Convoi activé : il roule"
      act: |
        R.click(R.L("ZONES DE COMBAT", "COMBAT ZONES"), R.L("Convoi d'Ochamchire", "Ochamchire convoy"), R.L("Activer la zone", "Activate zone"))
      check: |
        local z = veafCombatZone.GetZone("combatZone_Convoy")
        for _, name in pairs(z.spawnedGroups or {}) do
          local g = Group.getByName(name)
          local u = g and g:getUnit(1)
          if u then
            local p = u:getPoint()
            if R.mem.convoy and ((p.x - R.mem.convoy.x) ^ 2 + (p.z - R.mem.convoy.z) ^ 2) ^ 0.5 > 100 then
              return true, name .. " a roulé " .. math.floor(((p.x - R.mem.convoy.x) ^ 2 + (p.z - R.mem.convoy.z) ^ 2) ^ 0.5) .. " m"
            end
            R.mem.convoy = R.mem.convoy or { x = p.x, z = p.z }
          end
        end
        return false, "pas encore de déplacement"
      wait: 5
      timeout: 90
    doc: "mission-maker/scripts/veafCombatZone/"

  - id: convoy-ambush
    chapter: ground
    title: { fr: "Convoi sous le feu", en: "Convoy under fire" }
    anchor: { zone: "Embuscade" }
    modules: [GROUNDAI, SPAWN]
    what:
      fr: "Un convoi que vous lancez vers une embuscade de trois blindés rouges, à l'est de Kutaisi. Livré à DCS, il y mourrait sans tirer ; piloté par VEAF, il guette, se scinde, appelle l'appui aérien et se replie."
      en: "A convoy you send toward an ambush of three red armoured vehicles, east of Kutaisi. Left to DCS, it would die there without firing; driven by VEAF, it watches, splits, calls for air support and falls back."
    how:
      fr:
        - "Posez un marqueur dans la zone « Embuscade » avec `-convoy, dest EMBUSCADE, side blue` : le convoi prend la route vers l'est."
        - "Suivez-le sur la carte F10 ; l'embuscade attend à 400 m de la route, 2,8 km plus loin."
        - "Au contact, lisez son compte rendu, ouvert par son indicatif (Mule, Bison…) : « Bison, contact avant, 1 ennemi à 2290 m au 059, on engage le combat » ; un marqueur F10 le montre tant que le contact dure."
        - "Assez fort, il va au contact, détruit l'embuscade, va rechercher ses camions et reprend la route tout seul."
        - "Trop faible, il appelle l'appui aérien (*troops in contact*), marque l'ennemi d'un fumigène rouge et lui-même d'un vert, se replie et tient la position : `_gc <indicatif>, resume` le fait repartir."
      en:
        - "Drop a marker in the 'Embuscade' zone with `-convoy, dest EMBUSCADE, side blue`: the convoy takes the road east."
        - "Follow it on the F10 map; the ambush waits 400 m off the road, 2.8 km further on."
        - "At contact, read its report, opened by its callsign (Mule, Bison…): 'Bison, contact ahead, 1 enemy at 2290 m bearing 059, engaging'; an F10 marker shows it while the contact lasts."
        - "Strong enough, it closes in, destroys the ambush, fetches its trucks and drives on by itself."
        - "Outgunned, it calls for air support (*troops in contact*), marks the enemy with a red smoke and itself with a green one, falls back and holds: `_gc <callsign>, resume` sends it on its way."
    see:
      fr: "Avant le premier tir, les camions partent seuls (groupe « unarmed »), les véhicules armés vont au contact ou se replient s'ils sont trop faibles ; l'appel à l'aide ne vient que du repli."
      en: "Before the first shot, the trucks leave on their own (the 'unarmed' group), the armed vehicles close in, or fall back when outgunned; the call for help only comes with a fall back."
    check: "Le convoi réagit avant d'être détruit : groupe « unarmed » détaché, compte rendu de contact sous son indicatif, marqueur F10 ; vainqueur, il repart seul, par la route, ses camions repris ; en repli, appel « TROOPS IN CONTACT », fumigènes rouge et vert, puis il tient la position."
    probe:
    - name: "`-convoy, dest EMBUSCADE, side blue` : le convoi est surveillé"
      act: |
        R.marker("-convoy, dest EMBUSCADE, side blue", "Embuscade", 0, 0)
      check: |
        -- un convoi bleu : `-convoy` fait apparaître un convoi rouge sans `side blue`, et l'embuscade est rouge
        for name, h in pairs(veafGroundAI.convoysByGroupName or {}) do
          if h.side == coalition.side.BLUE then
            R.mem.ambushConvoy = h
            return true, name
          end
        end
        return false, "aucun convoi bleu surveillé"
      timeout: 20
    - name: "Au contact, il réagit avant d'être détruit"
      check: |
        local h = R.mem.ambushConvoy
        if not h then return false, "pas de convoi" end
        local state = ConvoyUnitHandler.stateToString(h.state)
        if h.state == ConvoyUnitHandler.STATE_FIGHTING or h.state == ConvoyUnitHandler.STATE_FALLING_BACK then
          return h:getGroup() ~= nil or h:getUnarmedGroup() ~= nil, state .. ", non armés : " .. tostring(h.unarmedGroupName)
        end
        return false, state
      wait: 5
      timeout: 400
    doc: "mission-maker/scripts/veafGroundAI/"

  # ── 3. Menace aérienne ─────────────────────────────────────────────────────────────────────
  - id: qra
    chapter: air
    title: { fr: "QRA de Soukhoumi", en: "Sukhumi QRA" }
    anchor: { zone: "QRA-Soukhoumi" }
    modules: [QRA, RADIO]
    what:
      fr: "Une alerte en vol (QRA) défend Soukhoumi dans un cercle de 40 km, qui couvre Ochamchire. Elle répond à la menace : un intrus fait décoller une paire tirée au sort entre MiG-29S et Su-27 ; trois intrus ou plus, deux paires parmi Su-30, MiG-31 et MiG-29S. Trois joueurs bleus connectés comptent comme trois intrus (étape suivante, niveau d'opposition). Elle ne réagit pas aux hélicoptères."
      en: "A quick reaction alert (QRA) defends Sukhumi within a 40 km circle that covers Ochamchire. It answers the threat: one intruder scrambles a pair drawn between MiG-29S and Su-27; three or more, two pairs among Su-30, MiG-31 and MiG-29S. Three blue players connected count as three intruders (next step, the opposition level). It ignores helicopters."
    how:
      fr:
        - "Entrez dans le cercle (dessiné sur la carte F10) avec un avion : la QRA décolle 60 s plus tard."
        - "Menu F10 > Autre > Démo : commandes > Arrêter / Démarrer la QRA de Soukhoumi (menu déclaré en YAML)."
      en:
        - "Enter the circle (drawn on the F10 map) in an aircraft: the QRA scrambles 60 s later."
        - "F10 > Other > Demo: commands > Stop / Start the Sukhumi QRA (a menu declared in YAML)."
    see:
      fr: "Un message annonce le décollage ; les chasseurs viennent vers vous. Une fois la QRA détruite, elle se réarme 5 minutes après que le cercle s'est vidé d'intrus."
      en: "A message announces the scramble; the fighters come at you. Once destroyed, the QRA rearms 5 minutes after the circle is clear of intruders."
    check: "Un seul joueur connecté, entrée d'un avion bleu dans le cercle : décollage d'une paire après 60 s ; avec trois intrus, deux paires ; aucune réaction à un hélicoptère ; menu Démo : commandes arrête et redémarre la QRA."
    probe:
    - name: "QRA de Soukhoumi prête"
      check: |
        local q = veafQraManager.get("QRA Sukhumi")
        local s = veafQraManager.statusToString(q.state)
        return s == "STATUS_READY", s
    doc: "mission-maker/scripts/veafQraManager/"

  - id: opposition
    chapter: air
    title: { fr: "Niveau d'opposition", en: "Opposition level" }
    modules: [QRA, COMBATMISSION]
    what:
      fr: "La chasse rouge se dimensionne au nombre de joueurs : la mission porte un niveau, le nombre d'avions bleus pour lequel l'opposition est réglée, qui suit ici les joueurs connectés. La QRA de Soukhoumi prend le palier du plus grand de ce niveau et des intrus dans son cercle ; les CAP à la demande offrent une taille automatique, une patrouille pour deux joueurs."
      en: "The red fighters scale with the number of players: the mission carries a level, the number of blue aircraft the opposition is sized for, which here follows the players connected. The Sukhumi QRA takes the tier of the bigger of that level and the intruders in its circle; the on-demand CAPs offer an automatic size, one patrol per two players."
    how:
      fr:
        - "Menu F10 > Autre > VEAF > Opposition > Niveau actuel : le niveau et son mode."
        - "Marqueur `_opposition 4` : le niveau passe à 4 et ne suit plus les joueurs ; `_opposition players` le refait suivre."
        - "Menu F10 > Autre > VEAF > MISSIONS > CAP MiG-29S Gudauta FL250 > Good > Taille auto (niveau d'opposition)."
      en:
        - "F10 > Other > VEAF > Opposition > Current level: the level and its mode."
        - "Marker `_opposition 4`: the level goes to 4 and stops following the players; `_opposition players` makes it follow again."
        - "F10 > Other > VEAF > MISSIONS > CAP MiG-29S Gudauta FL250 > Good > Auto scale (opposition level)."
    see:
      fr: "Chaque changement de niveau est annoncé à tous. Au niveau 4, un seul intrus dans le cercle de Soukhoumi fait décoller deux paires, et « Taille auto » active la CAP en scale 2. Quand un joueur se déconnecte, le niveau ne baisse qu'après 5 minutes."
      en: "Every change of level is announced to all. At level 4, a single intruder in the Sukhumi circle scrambles two pairs, and \"Auto scale\" activates the CAP at scale 2. When a player leaves, the level drops only after 5 minutes."
    check: "Opposition > Niveau actuel annonce le niveau ; `_opposition 4` l'annonce à 4 « fixe » ; un intrus seul dans le cercle de Soukhoumi fait alors décoller deux paires ; Taille auto active la CAP Good/2 ; `_opposition players` revient au nombre de joueurs connectés."
    probe:
    - name: "Un niveau d'opposition est réglé"
      check: |
        local level = veafOpposition.getLevel()
        return level ~= nil, tostring(level) .. " (" .. tostring(veafOpposition.follow) .. ")"
    - name: "`_opposition 4` : niveau 4, fixe"
      act: |
        R.marker("_opposition 4", "Bac a sable")
      check: |
        return veafOpposition.getLevel() == 4 and veafOpposition.follow == "off", tostring(veafOpposition.getLevel())
      timeout: 10
    - name: "La QRA de Soukhoumi choisit son palier d'après le niveau"
      check: |
        local q = veafQraManager.get("QRA Sukhumi")
        return q:tierCount(1) == 4, "un intrus compte pour " .. tostring(q:tierCount(1))
    - name: "Taille auto : la CAP MiG-29S Good apparaît en scale 2"
      act: |
        R.click("MISSIONS", "CAP MiG-29S Gudauta FL250", "Good", R.L("Taille auto (niveau d'opposition)", "Auto scale (opposition level)"))
      check: |
        local m = veafCombatMission.GetMission("CAP MiG-29S Gudauta FL250/Good/2")
        return m:isActive(), m:isActive() and "active" or "inactive"
      timeout: 30
    - name: "`_opposition players` : le niveau suit à nouveau les joueurs"
      act: |
        veafCombatMission.DesactivateMission("CAP MiG-29S Gudauta FL250/Good/2", true)
        R.marker("_opposition players", "Bac a sable")
      check: |
        return veafOpposition.follow == "players", tostring(veafOpposition.follow)
      timeout: 10
    doc: "mission-maker/scripts/veafQraManager/#opposition-level"

  - id: cap
    chapter: air
    title: { fr: "CAP à la demande et raid sur Senaki", en: "On-demand CAP and the Senaki raid" }
    anchor: { airbase: "Gudauta" }
    modules: [COMBATMISSION]
    what:
      fr: "Des patrouilles rouges qu'on fait apparaître depuis le menu, de menaces différentes (MiG-29S Fox 3, Su-27 Fox 1, MiG-31), et une mission scénarisée : deux Su-24M escortés par deux MiG-29S partent bombarder Senaki."
      en: "Red patrols you spawn from the menu, each a different threat (MiG-29S Fox 3, Su-27 Fox 1, MiG-31), and a scripted mission: two Su-24M escorted by two MiG-29S head out to bomb Senaki."
    how:
      fr:
        - "Menu F10 > Autre > VEAF > MISSIONS > CAP MiG-29S Gudauta FL250 > Good > scale 1 > Activer la mission ; même menu pour le niveau Excellent et la taille scale 2."
        - "Menu F10 > Autre > VEAF > MISSIONS > Raid sur Senaki > Good > scale 1 > Activer la mission, puis interceptez les bombardiers."
        - "Ou par marqueur : `-airstart Raid-Senaki/Good/1`, `-airstop Raid-Senaki/Good/1` (nom, niveau, taille)."
      en:
        - "F10 > Other > VEAF > MISSIONS > CAP MiG-29S Gudauta FL250 > Good > scale 1 > Activate mission; same menu for the Excellent level and scale 2."
        - "F10 > Other > VEAF > MISSIONS > Senaki raid > Good > scale 1 > Activate mission, then intercept the bombers."
        - "Or by marker: `-airstart Raid-Senaki/Good/1`, `-airstop Raid-Senaki/Good/1` (name, level, size)."
    see:
      fr: "La patrouille apparaît en vol sur son hippodrome et engage ce qui entre à portée ; le raid vole vers Senaki et bombarde la base s'il n'est pas intercepté."
      en: "The patrol spawns airborne on its race-track and engages what comes in range; the raid flies to Senaki and bombs the base unless intercepted."
    check: "Chaque CAP apparaît au niveau et à la taille demandés et engage (tir de missile sur une cible bleue) ; le raid apparaît avec son escorte et suit sa route vers Senaki ; `-airstart Raid-Senaki/Good/1` / `-airstop` fonctionnent."
    probe:
    - name: "Menu MISSIONS : la CAP MiG-29S Good scale 1 apparaît en vol"
      act: |
        R.click("MISSIONS", "CAP MiG-29S Gudauta FL250", "Good", "scale 1", R.L("Activer la mission", "Activate mission"))
      check: |
        local m = veafCombatMission.GetMission("CAP MiG-29S Gudauta FL250/Good/1")
        local groups = m:getSpawnedGroups() or {}
        local airborne = 0
        for _, g in pairs(groups) do
          if g:isExist() and g:getUnit(1) and g:getUnit(1):inAir() then airborne = airborne + 1 end
        end
        return m:isActive() and airborne > 0, airborne .. " groupe(s) en vol"
      timeout: 30
    - name: "`-airstart Raid-Senaki/Good/1` : le raid apparaît avec son escorte"
      act: |
        R.marker("-airstart Raid-Senaki/Good/1", "Bac a sable")
      check: |
        local m = veafCombatMission.GetMission("Raid-Senaki/Good/1")
        local n = R.count(m:getSpawnedGroups())
        return m:isActive() and n >= 2, n .. " groupes"
      timeout: 30
    - name: "`-airstop Raid-Senaki/Good/1` : le raid s'arrête"
      act: |
        R.marker("-airstop Raid-Senaki/Good/1", "Bac a sable")
      check: |
        return not veafCombatMission.GetMission("Raid-Senaki/Good/1"):isActive(), ""
      timeout: 20
    doc: "mission-maker/scripts/veafCombatMission/"

  - id: airwaves
    chapter: air
    title: { fr: "Arène BVR (vagues aériennes)", en: "BVR arena (air waves)" }
    anchor: { zone: "Arene BVR" }
    modules: [AIRWAVES, RADIO]
    what:
      fr: "Une arène au large de Poti : dès qu'un avion bleu y entre, des vagues de chasseurs rouges arrivent l'une après l'autre, de plus en plus dures (MiG-29S seul, deux Su-27, deux Su-30)."
      en: "An arena off Poti: as soon as a blue aircraft enters, waves of red fighters come one after another, harder each time (a single MiG-29S, two Su-27, two Su-30)."
    how:
      fr:
        - "Entrez dans le cercle de l'arène (dessiné sur la carte F10), entre 1 000 et 40 000 ft."
        - "Pour recommencer : F10 > Autre > Démo : commandes > Relancer l'arène BVR."
      en:
        - "Enter the arena circle (drawn on the F10 map), between 1,000 and 40,000 ft."
        - "To start over: F10 > Other > Demo: commands > Reset the BVR arena."
    see:
      fr: "Message de début, puis une vague ; la suivante arrive une minute après la destruction de la précédente. Si vous mourez, l'arène se réinitialise."
      en: "A start message, then a wave; the next comes one minute after the previous is destroyed. If you die, the arena resets."
    check: "Entrée d'un joueur bleu : vague 1 après 30 s ; vague suivante 60 s après la destruction de la précédente ; reset par le menu Démo : commandes."
    probe:
    - name: "Arène BVR enregistrée avec ses trois vagues"
      check: |
        local w = veafAirWaves.get("Arene BVR")
        return w ~= nil and #w.waves == 3, w and (#w.waves .. " vagues, état " .. tostring(w.state)) or "absente"
    doc: "mission-maker/scripts/veafAirWaves/"

  - id: sanctuary
    chapter: air
    title: { fr: "Sanctuaire rouge de Gudauta", en: "Gudauta red sanctuary" }
    anchor: { zone: "Sanctuaire Gudauta" }
    modules: [SANCTUARY]
    what:
      fr: "Un sanctuaire protège une zone pour un camp : un pilote adverse qui y entre est averti, puis une défense apparaît, puis il est abattu. Celui-ci protège Gudauta (15 km) côté rouge ; il détruit aussi les missiles tirés sur les unités qui s'y trouvent."
      en: "A sanctuary protects an area for one side: an enemy pilot who enters is warned, then defences spawn, then the aircraft is shot down. This one protects Gudauta (15 km) for red; it also destroys missiles fired at units inside it."
    how:
      fr:
        - "Entrez dans le cercle de Gudauta avec un avion bleu et restez-y."
      en:
        - "Fly into the Gudauta circle in a blue aircraft and stay."
    see:
      fr: "Avertissement après 10 s, défense déployée à 60 s, avion abattu à 120 s."
      en: "Warning after 10 s, defences deployed at 60 s, aircraft shot down at 120 s."
    check: "Joueur bleu dans le cercle : avertissement à 10 s, défense à 60 s, destruction à 120 s ; un missile tiré sur une unité rouge du sanctuaire est détruit."
    probe:
    - name: "Sanctuaire rouge de Gudauta enregistré (15 km, protection contre les missiles)"
      check: |
        local s = veafSanctuary.zonesList[1]
        return s ~= nil and math.abs(s.radius - 15000) < 500 and s.protectFromMissiles == true, s and (s.name .. ", " .. math.floor(s.radius) .. " m") or "absent"
    doc: "mission-maker/scripts/veafSanctuary/"

  # ── 4. Soutien et logistique ───────────────────────────────────────────────────────────────
  - id: assets
    chapter: support
    title: { fr: "Ravitailleurs, AWACS et escorte", en: "Tankers, AWACS and escort" }
    anchor: { group: "Texaco 1" }
    modules: [ASSETS, MOVE]
    what:
      fr: "Deux ravitailleurs (Texaco 1 à perche, Arco 1 à panier) et un AWACS (Overlord 1) escorté par deux F-15C. Le menu MOYENS les relance et donne leurs informations ; une commande de marqueur déplace un ravitailleur."
      en: "Two tankers (Texaco 1 boom, Arco 1 drogue) and an AWACS (Overlord 1) escorted by two F-15C. The ASSETS menu respawns them and gives their details; a marker command moves a tanker."
    how:
      fr:
        - "Texaco 1 : TACAN 52Y, 292.0 AM, FL200 ; Arco 1 : TACAN 51Y, 291.0 AM, FL180 ; Overlord 1 : 286.0 AM."
        - "Menu F10 > Autre > VEAF > MOYENS > Overlord 1 (E-3A) > Réapparition de Overlord 1 (E-3A) : l'AWACS et son escorte réapparaissent ensemble."
        - "Marqueur `_move tanker, name Texaco 1, alt 22000` posé où vous voulez l'hippodrome."
      en:
        - "Texaco 1: TACAN 52Y, 292.0 AM, FL200; Arco 1: TACAN 51Y, 291.0 AM, FL180; Overlord 1: 286.0 AM."
        - "F10 > Other > VEAF > ASSETS > Overlord 1 (E-3A) > Respawn Overlord 1 (E-3A): the AWACS and its escort respawn together."
        - "Marker `_move tanker, name Texaco 1, alt 22000` where you want the race-track."
    see:
      fr: "Les ravitailleurs répondent sur leur fréquence et leur TACAN ; après un _move tanker, Texaco 1 rejoint sa nouvelle orbite."
      en: "Tankers answer on their frequency and TACAN; after a _move tanker, Texaco 1 flies to its new orbit."
    check: "Ravitaillement possible sur Texaco 1 (perche) et Arco 1 (panier), TACAN reçus ; réapparition d'Overlord 1 avec son escorte ; `_move tanker` déplace l'orbite de Texaco 1."
    probe:
    - name: "Texaco 1, Arco 1, Overlord 1 et son escorte en vol"
      check: |
        local parts, ok = {}, true
        for _, name in ipairs({ "Texaco 1", "Arco 1", "Overlord 1", "Overlord 1 escort" }) do
          local g = Group.getByName(name)
          local up = g and g:getUnit(1) and g:getUnit(1):inAir()
          ok = ok and up
          table.insert(parts, name .. (up and " en vol" or " ABSENT"))
        end
        return ok and true or false, table.concat(parts, ", ")
    - name: "Menu MOYENS : Overlord 1 réapparaît avec son escorte"
      act: |
        R.mem.awacsId, R.mem.escortId = Group.getByName("Overlord 1"):getID(), Group.getByName("Overlord 1 escort"):getID()
        R.click(R.L("MOYENS", "ASSETS"), "Overlord 1 (E-3A)", R.L("Réapparition de Overlord 1 (E-3A)", "Respawn Overlord 1 (E-3A)"))
      check: |
        local a, e = Group.getByName("Overlord 1"), Group.getByName("Overlord 1 escort")
        if not (a and e and a:getUnit(1) and e:getUnit(1)) then return false, "AWACS ou escorte absent" end
        local renewed = a:getID() ~= R.mem.awacsId and e:getID() ~= R.mem.escortId
        local pa, pe = a:getUnit(1):getPoint(), e:getUnit(1):getPoint()
        local km = ((pa.x - pe.x) ^ 2 + (pa.z - pe.z) ^ 2) ^ 0.5 / 1000
        return renewed and km < 10, "réapparus : " .. tostring(renewed) .. ", escorte à " .. math.floor(km) .. " km de l'AWACS"
      wait: 10
      timeout: 30
    doc: "mission-maker/scripts/veafAssets/"

  - id: helos
    chapter: support
    title: { fr: "Hélicoptères : FARP, CTLD, CSAR", en: "Helicopters: FARP, CTLD, CSAR" }
    anchor: { group: "FARP Khoni" }
    modules: [CTLD, CSAR, GRASS]
    what:
      fr: "Le FARP Khoni réarme et ravitaille les hélicoptères ; son dépôt de munitions est un point de chargement CTLD (troupes et caisses). Un pilote abattu peut être créé à la demande, à aller chercher en hélicoptère (CSAR)."
      en: "FARP Khoni rearms and refuels helicopters; its ammo dump is a CTLD loading point (troops and crates). A downed pilot can be created on demand, to be rescued by helicopter (CSAR)."
    how:
      fr:
        - "Décollez de Kutaisi en UH-1H ou Mi-8 et posez-vous au FARP Khoni (127.5 AM)."
        - "Menu F10 > Autre > CTLD : charger des troupes, demander une caisse, puis les déposer ailleurs."
        - "Menu F10 > Autre > Démo : commandes > Créer un pilote abattu près de Khoni, puis menu CSAR pour sa balise et sa position."
      en:
        - "Take off from Kutaisi in a UH-1H or Mi-8 and land at FARP Khoni (127.5 AM)."
        - "F10 > Other > CTLD: load troops, request a crate, then drop them elsewhere."
        - "F10 > Other > Demo: commands > Create a downed pilot near Khoni, then the CSAR menu for its beacon and position."
    see:
      fr: "Le FARP ravitaille et réarme ; CTLD charge les troupes ; le pilote abattu émet une balise et se laisse embarquer."
      en: "The FARP refuels and rearms; CTLD loads the troops; the downed pilot transmits a beacon and boards."
    check: "Ravitaillement et réarmement au FARP Khoni ; chargement CTLD de troupes et d'une caisse au FARP ; pilote abattu créé par le menu, balise ADF audible, récupérable et ramené."
    probe:
    - name: "FARP Khoni présent"
      check: |
        return Airbase.getByName("FARP Khoni") ~= nil, ""
    - name: "Pilote abattu créé par la fonction du menu Démo : commandes"
      act: |
        R.mem.csarBefore = R.count(csar.woundedGroups)
        demo.spawnCsar()
      check: |
        local n = R.count(csar.woundedGroups)
        return n > R.mem.csarBefore, R.mem.csarBefore .. " -> " .. n .. " pilote(s) à secourir"
      timeout: 15
    doc: "mission-maker/GUIDE/"

  - id: carrier
    chapter: support
    title: { fr: "Porte-avions Stennis et Roosevelt", en: "Stennis and Roosevelt carriers" }
    anchor: { group: "CSG-74 Stennis" }
    modules: [CARRIER]
    what:
      fr: "Deux porte-avions au large de Batumi, chacun avec son ravitailleur S-3B et son hélicoptère de sauvetage. Le menu OPS PORTE-AVIONS met le navire face au vent pour les opérations aériennes."
      en: "Two carriers off Batumi, each with its S-3B tanker and rescue helicopter. The CARRIER OPS menu turns the ship into the wind for air operations."
    how:
      fr:
        - "Stennis : TACAN 74X STN, ICLS 4, Link 4 336.0, tour 274.0 AM. Roosevelt : TACAN 71X TDR, ICLS 1, Link 4 337.0, tour 271.0 AM."
        - "Menu F10 > Autre > VEAF > OPS PORTE-AVIONS > OPS PORTE-AVIONS - BLEU > CSG-74 Stennis > +Démarrer les opérations aériennes pour 45 minutes."
        - "Slots de pont : Stennis F/A-18C, Roosevelt F-14B."
      en:
        - "Stennis: TACAN 74X STN, ICLS 4, Link 4 336.0, tower 274.0 AM. Roosevelt: TACAN 71X TDR, ICLS 1, Link 4 337.0, tower 271.0 AM."
        - "F10 > Other > VEAF > CARRIER OPS > CARRIER OPS - BLUE > CSG-74 Stennis > +Start carrier air operations for 45 minutes."
        - "Deck slots: Stennis F/A-18C, Roosevelt F-14B."
    see:
      fr: "Le porte-avions vire face au vent, accélère, et le menu donne le cap de récupération ; le S-3B ravitaille."
      en: "The carrier turns into the wind, speeds up, and the menu gives the recovery course; the S-3B refuels."
    check: "Démarrage des opérations : virage face au vent et vitesse ; TACAN / ICLS / Link 4 reçus ; S-3B et Pedro présents pour chaque navire."
    probe:
    - name: "Opérations aériennes du Stennis : il accélère face au vent"
      act: |
        R.click(R.L("OPS PORTE-AVIONS", "CARRIER OPS"), R.L("OPS PORTE-AVIONS - BLEU", "CARRIER OPS - BLUE"), "CSG-74 Stennis", R.L("Démarrer les opérations aériennes pour 45 minutes", "Start carrier air operations for 45 minutes"))
      check: |
        local c = veafCarrierOperations.carriers["CSG-74 Stennis"]
        local v = Unit.getByName(c.carrierUnitName):getVelocity()
        local kt = (v.x ^ 2 + v.z ^ 2) ^ 0.5 * 1.944
        local hdg = math.deg(math.atan2(v.z, v.x)) % 360
        local gap = math.abs((hdg - (c.heading or -999) + 180) % 360 - 180)
        return c.conductingAirOperations == true and kt > 3 and gap < 15, "opérations " .. tostring(c.conductingAirOperations) .. ", cap " .. math.floor(hdg) .. " pour BRC " .. tostring(c.heading and math.floor(c.heading)) .. ", " .. math.floor(kt) .. " kt"
      wait: 30
      timeout: 180
    - name: "S-3B et Pedro du Stennis présents avec les opérations"
      check: |
        local c = veafCarrierOperations.carriers["CSG-74 Stennis"]
        local t, p = Unit.getByName(c.tankerUnitName), Unit.getByName(c.pedroUnitName)
        return t ~= nil and p ~= nil, "S-3B " .. tostring(t ~= nil) .. ", Pedro " .. tostring(p ~= nil)
      timeout: 60
    doc: "mission-maker/scripts/veafCarrierOperations/"

  - id: weather
    chapter: support
    title: { fr: "Météo, ATC et assistance cockpit", en: "Weather, ATC and cockpit assistance" }
    anchor: { airbase: "Kutaisi" }
    modules: [WEATHER, AIRBASES, ASSIST, STTS, build:weather]
    what:
      fr: "Un message d'accueil à la prise de slot (base, piste en service, météo), un menu météo et ATC, et pour le F-16C une checklist de démarrage pas à pas. Sur un serveur VEAF, la météo suit la METAR réelle de Kutaisi (UGKO)."
      en: "A welcome message when you take a slot (base, runway in use, weather), a weather and ATC menu, and for the F-16C a step-by-step start-up checklist. On a VEAF server, the weather follows Kutaisi's real METAR (UGKO)."
    how:
      fr:
        - "Prenez un slot à Kutaisi : lisez le message d'accueil."
        - "Menu F10 > Autre > VEAF > MÉTÉO ET ATC > Météo sur le point le plus proche ; dans le même menu, ATC de la base la plus proche."
        - "En F-16C à Kutaisi : F10 > Autre > VEAF > ASSISTANCE > Démarrage à froid ; ensuite, à la racine du menu VEAF : ASSISTANCE : VALIDER L'ÉTAPE / PASSER L'ÉTAPE."
      en:
        - "Take a slot at Kutaisi: read the welcome message."
        - "F10 > Other > VEAF > WEATHER AND ATC > Weather on closest point; in the same menu, ATC on closest airbase."
        - "In the F-16C at Kutaisi: F10 > Other > VEAF > ASSISTANCE > Cold start; then, at the root of the VEAF menu: ASSISTANCE: CONFIRM THE STEP / ASSISTANCE: SKIP THE STEP."
    see:
      fr: "Le message d'accueil donne la piste en service ; la checklist coche les étapes déjà faites."
      en: "The welcome message gives the runway in use; the checklist ticks the steps already done."
    check: "Message d'accueil à la prise de slot ; menu MÉTÉO ET ATC répond ; checklist F-16C proposée au seul F-16C ; chaque variante météo du build diffère (nuages, température, vent)."
    doc: "mission-maker/scripts/veafWeather/"
