  Raid-Senaki:
    friendly_name: Senaki raid
    briefing: "Two Su-24M escorted by two MiG-29S take off from the Gudauta area to bomb Senaki. Intercept them before they reach the base."
    elements:
      Bombardiers: Bombers
      Escorte: Escort
